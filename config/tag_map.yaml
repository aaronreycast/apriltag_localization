    x: 0.0
    y: 2.5
    # measured 07/17/26 by tape
    # top of the laminated A4 sheet aligned with the wall top, 0.36 m above still water; sheet top to black-square centre 0.1185 m; centre therefore 0.2415 m
    z: 0.2415 # height of tag center from water surface level (initially 0.5m, fixed at 0.2415m for final version)
